name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: gregkozakiewicz/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
